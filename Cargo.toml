[package]
name = "claude_openai_proxy"
version = "0.1.15"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["http1","macros"] }
tokio = { version = "1", features = ["rt-multi-thread","macros","signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json","http2","stream","rustls-tls"] }
tokio-stream = "0.1"
futures = "0.3"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
tiktoken-rs = "0.6"
tower-http = { version = "0.6.6", features = ["compression-gzip"] }
ml-kem = { version = "0.3", features = ["getrandom", "hazmat"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
flate2 = "1"
base64 = "0.22"
rand = "0.9"
# Pure-Rust Intel DCAP/TDX quote verification (the "trusted root" of the chain).
# default-features=false drops the reqwest/Phala-PCCS collateral fetch client —
# we do hardware verification offline against supplied collateral + the embedded
# Intel root CA. rustcrypto backend (no ring/assembly) keeps macOS/arm64 clean.
dcap-qvl = { version = "0.7", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
hex = "0.4"
# X.509 cert parsing for FMSPC extraction from the PCK leaf cert in a TDX quote.
# Pinned to the version dcap-qvl already pulls in transitively (0.3.0) so no new
# transitive dependency is introduced — only a direct dependency on what's there.
x509-cert = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
